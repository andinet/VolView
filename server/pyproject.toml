[tool.poetry]
name = "volview-server"
version = "0.1.0"
description = "VolView VISTA3D Server with MONAI Integration"
authors = ["VolView Team <volview@kitware.com>"]
license = "Apache-2.0"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.8.1"

# Core scientific computing
itk = "^5.3.0"
numpy = "^1.24.1"
setuptools = "^68.0.0"

# Web server & API
fastapi = "^0.104.0"
uvicorn = {extras = ["standard"], version = "^0.22.0"}
python-multipart = "^0.0.6"
pydantic = "^2.0.0"
aiohttp = "3.9.2"
python-socketio = "^5.8.0"
charset-normalizer = "^3.1.0"

# MONAI & Machine Learning
monai = {extras = ["all"], version = "^1.3.0"}
torch = "^2.0.0"
torchvision = "^0.15.0"

# Medical imaging formats
nibabel = "^5.0.0"
pynrrd = "^1.1.0"

[tool.poetry.group.dev.dependencies]
# Code formatting & linting
black = "^23.1.0"
flake8 = "^6.0.0"
isort = "^5.12.0"
mypy = "^1.0.0"

# Testing
pytest = "^7.2.1"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.11.0"

# Development tools
ipython = "^8.12.0"
ipdb = "^0.13.13"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=volview_server --cov-report=term-missing"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
